name: Update Routine

# Routine publishes to a single unversioned URL with no releases feed, so there
# is nothing to subscribe to -- the only way to notice a new build is to fetch
# the AppImage and hash it. Hence a plain daily poll.
on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC daily (11:00 Asia/Kuala_Lumpur).
    - cron: "0 3 * * *"

# Never let two runs race on sources.json.
concurrency:
  group: update-routine
  cancel-in-progress: false

jobs:
  update:
    name: Refresh sources.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Fetch latest AppImage and rewrite sources.json
        run: nix run .#update

      - name: Detect change
        id: diff
        run: |
          if git diff --quiet -- sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sources.json unchanged; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "version=$(jq -r '."x86_64-linux".version' sources.json)"
            } >> "$GITHUB_OUTPUT"
            git --no-pager diff -- sources.json
          fi

      # Don't commit a version that cannot build. Routine is unfree, so the
      # build needs an explicit opt-in.
      - name: Verify the new version builds
        if: steps.diff.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: nix build --impure --no-link --print-out-paths .#routine

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "routine: update to ${{ steps.diff.outputs.version }}"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "Updated to ${{ steps.diff.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new build upstream." >> "$GITHUB_STEP_SUMMARY"
          fi
